<section class="ct-carrington">
  <header class="ct-carrington__intro">
    <i class="fas fa-moon"></i>
    <div>
      <h2>Говорящая доска</h2>
      <p>Планшетка медленно соберёт послание по одной букве и покажет его поверх сцены.</p>
    </div>
  </header>

  <div class="ct-carrington__panel">
    <div class="ct-carrington__control">
      <span class="ct-carrington__label">Заготовка</span>
      <select class="ct-carrington-preset">
        <option value="">Выбрать готовую фразу…</option>
        {{#each presets}}
          <option value="{{this}}">{{this}}</option>
        {{/each}}
      </select>
    </div>

    <div class="ct-carrington__control">
      <span class="ct-carrington__label">Послание мадам Каррингтон</span>
      <textarea class="ct-carrington-message" rows="6" placeholder="Введите таинственный ответ…"></textarea>
    </div>
  </div>

  <div class="ct-carrington__footer">
    <div class="ct-carrington__control ct-carrington__duration">
      <span class="ct-carrington__label">Оставить на сцене</span>
      <select class="ct-carrington-duration">
        <option value="18000">18 секунд</option>
        <option value="30000" selected>30 секунд</option>
        <option value="0">Пока не закроют</option>
      </select>
    </div>

    <div class="ct-carrington__pace">
      <i class="fas fa-feather-pointed"></i>
      <span><strong>Медленное письмо</strong><small>по одной букве</small></span>
    </div>
  </div>

  <button type="button" class="ct-carrington-send">
    <i class="fas fa-moon"></i> Явить послание игрокам
  </button>
</section>
